<h2 class="sr-only">Flip 7 pass-and-play prototype: a multiplayer card game where players hit or stay to score 200 points</h2>

<div id="app" style="padding: 1rem 0; font-family: var(--font-sans);">
  <div id="screen"></div>
</div>

<style>
  .card {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 72px;
    border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary);
    font-weight: 500;
    font-size: 20px;
    margin: 2px;
    padding: 4px;
    text-align: center;
    line-height: 1.1;
  }
  .card-small { width: 38px; height: 54px; font-size: 15px; }
  .card-num { background: #E6F1FB; color: #042C53; }
  .card-mod { background: #EEEDFE; color: #26215C; font-size: 14px; }
  .card-action { background: #FAEEDA; color: #412402; font-size: 11px; }
  .card-back { background: var(--color-background-tertiary); color: var(--color-text-tertiary); font-size: 11px; }
  .player-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1rem;
    margin-bottom: 12px;
  }
  .player-active { border: 2px solid var(--color-border-info); }
  .player-busted { opacity: 0.5; }
  .player-stayed { background: var(--color-background-secondary); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--border-radius-md); margin-left: 6px; }
  .badge-bust { background: #FCEBEB; color: #501313; }
  .badge-stay { background: #EAF3DE; color: #173404; }
  .badge-flip7 { background: #FAEEDA; color: #412402; }
  .btn-primary { background: var(--color-text-primary); color: var(--color-background-primary); border: none; }
  .btn-primary:hover { opacity: 0.85; }
  .log-entry { font-size: 13px; color: var(--color-text-secondary); padding: 4px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px; }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); }
  .metric-value { font-size: 22px; font-weight: 500; margin-top: 2px; }
  h2 { font-size: 18px; font-weight: 500; margin: 0 0 12px; }
  h3 { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .section { margin-bottom: 1.5rem; }
  input[type="text"] { width: 200px; }
  .modal-bg {
    background: rgba(0,0,0,0.5);
    border-radius: var(--border-radius-lg);
    padding: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
  }
  .modal {
    background: var(--color-background-primary);
    border-radius: var(--border-radius-lg);
    padding: 1.5rem;
    max-width: 420px;
    width: 100%;
    border: 0.5px solid var(--color-border-secondary);
  }
</style>

<script>
(function() {
  const screen = document.getElementById('screen');

  // Game state
  let state = {
    phase: 'setup', // setup, pass, playing, roundEnd, gameEnd, actionTarget, flipThree
    players: [],
    dealer: 0,
    currentPlayerIdx: 0,
    deck: [],
    discard: [],
    log: [],
    round: 0,
    pendingAction: null,
    pendingActionSource: null,
    flipThreeRemaining: 0,
    flipThreeTarget: null,
    pendingExtras: [],
    lastDrawnCard: null,
    showCardReveal: false,
  };

  function buildDeck() {
    const deck = [];
    // Number cards: N copies of card N (plus one 0)
    deck.push({ type: 'num', value: 0 });
    for (let n = 1; n <= 12; n++) {
      for (let i = 0; i < n; i++) deck.push({ type: 'num', value: n });
    }
    // Modifiers
    for (let i = 0; i < 1; i++) deck.push({ type: 'mod', value: 2, label: '+2' });
    for (let i = 0; i < 1; i++) deck.push({ type: 'mod', value: 4, label: '+4' });
    for (let i = 0; i < 1; i++) deck.push({ type: 'mod', value: 6, label: '+6' });
    for (let i = 0; i < 1; i++) deck.push({ type: 'mod', value: 8, label: '+8' });
    for (let i = 0; i < 1; i++) deck.push({ type: 'mod', value: 10, label: '+10' });
    for (let i = 0; i < 1; i++) deck.push({ type: 'mod', value: 'x2', label: 'x2' });
    // Action cards: 3 Freeze, 3 Flip Three, 3 Second Chance
    for (let i = 0; i < 3; i++) deck.push({ type: 'action', value: 'freeze', label: 'Freeze' });
    for (let i = 0; i < 3; i++) deck.push({ type: 'action', value: 'flipthree', label: 'Flip 3' });
    for (let i = 0; i < 3; i++) deck.push({ type: 'action', value: 'second', label: '2nd Chance' });
    return deck;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function log(msg) {
    state.log.unshift(msg);
    if (state.log.length > 30) state.log.pop();
  }

  function drawCard() {
    if (state.deck.length === 0) {
      if (state.discard.length === 0) return null;
      state.deck = shuffle([...state.discard]);
      state.discard = [];
      log('Deck reshuffled from discards.');
    }
    return state.deck.pop();
  }

  function calcRoundScore(p) {
    const numSum = p.numbers.reduce((a, c) => a + c.value, 0);
    const hasX2 = p.modifiers.some(m => m.value === 'x2');
    const flatBonus = p.modifiers.filter(m => m.value !== 'x2').reduce((a, m) => a + m.value, 0);
    let score = hasX2 ? numSum * 2 : numSum;
    score += flatBonus;
    if (p.numbers.length === 7) score += 15;
    if (p.busted) score = 0;
    return score;
  }

  function activePlayers() {
    return state.players.filter(p => !p.busted && !p.stayed && !p.frozen);
  }

  function render() {
    if (state.phase === 'setup') return renderSetup();
    if (state.phase === 'pass') return renderPassDevice();
    if (state.phase === 'playing') return renderGame();
    if (state.phase === 'actionTarget') return renderGame();
    if (state.phase === 'cardReveal') return renderGame();
    if (state.phase === 'roundEnd') return renderRoundEnd();
    if (state.phase === 'gameEnd') return renderGameEnd();
  }

  function renderSetup() {
    screen.innerHTML = `
      <h2>Flip 7 — pass & play</h2>
      <p style="color: var(--color-text-secondary); margin: 0 0 1.5rem;">Add 3 or more players, then pass the device between turns. First to 200 wins.</p>
      <div class="section">
        <div class="row" style="margin-bottom: 12px;">
          <input type="text" id="pname" placeholder="Player name" maxlength="16" />
          <button onclick="window._addPlayer()">Add player</button>
        </div>
        <div id="plist"></div>
      </div>
      <div class="row">
        <button class="btn-primary" onclick="window._startGame()" ${state.players.length < 3 ? 'disabled' : ''}>Start game (${state.players.length} players)</button>
        ${state.players.length > 0 ? '<button onclick="window._clearPlayers()">Clear</button>' : ''}
      </div>
    `;
    const plist = document.getElementById('plist');
    plist.innerHTML = state.players.map((p, i) => `
      <div style="display: flex; justify-content: space-between; padding: 8px 12px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); margin-bottom: 6px;">
        <span>${p.name}</span>
        <button onclick="window._removePlayer(${i})" style="padding: 2px 10px; font-size: 12px;">Remove</button>
      </div>
    `).join('');
    const input = document.getElementById('pname');
    if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') window._addPlayer(); });
  }

  function renderPassDevice() {
    const p = state.players[state.currentPlayerIdx];
    screen.innerHTML = `
      <div class="modal-bg">
        <div class="modal" style="text-align: center;">
          <h2 style="margin-bottom: 8px;">Pass to ${p.name}</h2>
          <p style="color: var(--color-text-secondary); margin: 0 0 1.5rem; font-size: 14px;">It's your turn. Tap when ready.</p>
          <button class="btn-primary" onclick="window._readyToPlay()">I'm ${p.name}</button>
        </div>
      </div>
    `;
  }

  function renderGame() {
    const current = state.players[state.currentPlayerIdx];
    const isActive = current && !current.busted && !current.stayed && !current.frozen;

    let actionUI = '';
    if (state.phase === 'actionTarget') {
      const targets = activePlayers();
      actionUI = `
        <div class="modal-bg">
          <div class="modal">
            <h3>Play ${state.pendingAction.label} on:</h3>
            <p style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 12px;">
              ${state.pendingAction.value === 'freeze' ? 'That player banks their points and is out of the round.' : ''}
              ${state.pendingAction.value === 'flipthree' ? 'That player will receive the next 3 cards.' : ''}
              ${state.pendingAction.value === 'second' ? 'Give this card to another active player.' : ''}
            </p>
            <div class="row">
              ${targets.map(t => {
                const idx = state.players.indexOf(t);
                const disabled = state.pendingAction.value === 'second' && t.secondChance;
                return `<button onclick="window._resolveAction(${idx})" ${disabled ? 'disabled title="Already has Second Chance"' : ''}>${t.name}${t === current ? ' (self)' : ''}</button>`;
              }).join('')}
              ${state.pendingAction.value === 'second' && targets.every(t => t.secondChance || t === current && current.secondChance) ? 
                '<button onclick="window._discardAction()">Discard (all have one)</button>' : ''}
            </div>
          </div>
        </div>
      `;
    }

    let revealUI = '';
    if (state.phase === 'cardReveal' && state.lastDrawnCard) {
      const c = state.lastDrawnCard;
      revealUI = `
        <div class="modal-bg">
          <div class="modal" style="text-align: center;">
            <p style="color: var(--color-text-secondary); font-size: 13px; margin: 0 0 12px;">${c.forPlayer} drew:</p>
            <div style="display: flex; justify-content: center; margin-bottom: 16px;">${renderCard(c.card)}</div>
            <p style="margin: 0 0 16px; font-weight: 500;">${c.message}</p>
            <button class="btn-primary" onclick="window._dismissReveal()">Continue</button>
          </div>
        </div>
      `;
    }

    screen.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="margin: 0;">Round ${state.round}</h2>
        <div style="font-size: 13px; color: var(--color-text-secondary);">Deck: ${state.deck.length} · Discard: ${state.discard.length}</div>
      </div>

      <div class="section">
        ${state.players.map((p, i) => renderPlayer(p, i === state.currentPlayerIdx && isActive)).join('')}
      </div>

      ${isActive && state.phase === 'playing' ? `
        <div class="section" style="padding: 1rem; background: var(--color-background-secondary); border-radius: var(--border-radius-lg);">
          <p style="margin: 0 0 12px; font-size: 14px;"><strong>${current.name}</strong>, your move:</p>
          <div class="row">
            <button class="btn-primary" onclick="window._hit()">Hit</button>
            <button onclick="window._stay()" ${current.numbers.length === 0 && current.modifiers.length === 0 ? 'disabled title="Need at least one card to stay"' : ''}>Stay (${calcRoundScore(current)} pts)</button>
          </div>
        </div>
      ` : ''}

      <details class="section">
        <summary style="cursor: pointer; font-size: 14px; color: var(--color-text-secondary);">Game log</summary>
        <div style="margin-top: 8px; max-height: 200px; overflow-y: auto;">
          ${state.log.map(l => `<div class="log-entry">${l}</div>`).join('')}
        </div>
      </details>

      ${actionUI}
      ${revealUI}
    `;
  }

  function renderCard(c, small) {
    const cls = small ? 'card card-small' : 'card';
    if (c.type === 'num') return `<span class="${cls} card-num">${c.value}</span>`;
    if (c.type === 'mod') return `<span class="${cls} card-mod">${c.label}</span>`;
    if (c.type === 'action') return `<span class="${cls} card-action">${c.label}</span>`;
    return '';
  }

  function renderPlayer(p, isCurrent) {
    const cls = ['player-card'];
    if (isCurrent) cls.push('player-active');
    if (p.busted) cls.push('player-busted');
    if (p.stayed || p.frozen) cls.push('player-stayed');

    let badge = '';
    if (p.busted) badge = '<span class="badge badge-bust">Busted</span>';
    else if (p.frozen) badge = '<span class="badge badge-stay">Frozen</span>';
    else if (p.stayed) badge = '<span class="badge badge-stay">Stayed</span>';
    else if (p.numbers.length === 7) badge = '<span class="badge badge-flip7">Flip 7!</span>';

    const numbers = [...p.numbers].sort((a, b) => a.value - b.value);
    const score = calcRoundScore(p);

    return `
      <div class="${cls.join(' ')}">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
          <div>
            <strong>${p.name}</strong>${badge}
            ${p.secondChance ? '<span class="badge" style="background: #E1F5EE; color: #04342C;">2nd Chance</span>' : ''}
          </div>
          <div style="font-size: 13px; color: var(--color-text-secondary);">
            Total: <strong style="color: var(--color-text-primary);">${p.totalScore}</strong>
            ${p.numbers.length > 0 || p.modifiers.length > 0 ? ` · round: <strong style="color: var(--color-text-primary);">${score}</strong>` : ''}
          </div>
        </div>
        ${p.modifiers.length > 0 ? `<div style="margin-bottom: 4px;">${p.modifiers.map(c => renderCard(c, true)).join('')}</div>` : ''}
        <div>${numbers.map(c => renderCard(c, true)).join('')}</div>
        ${p.numbers.length === 0 && p.modifiers.length === 0 ? '<div style="font-size: 12px; color: var(--color-text-tertiary); padding: 8px 0;">No cards yet</div>' : ''}
      </div>
    `;
  }

  function renderRoundEnd() {
    const sorted = [...state.players].map(p => ({ ...p, roundScore: calcRoundScore(p) })).sort((a, b) => b.totalScore - a.totalScore);
    screen.innerHTML = `
      <h2>Round ${state.round} complete</h2>
      <div class="section">
        ${sorted.map(p => `
          <div class="player-card">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <strong>${p.name}</strong>
              <div>
                <span style="color: var(--color-text-secondary); font-size: 13px;">+${p.roundScore}</span>
                <span style="font-size: 18px; font-weight: 500; margin-left: 12px;">${p.totalScore}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" onclick="window._nextRound()">Start round ${state.round + 1}</button>
    `;
  }

  function renderGameEnd() {
    const sorted = [...state.players].sort((a, b) => b.totalScore - a.totalScore);
    const winner = sorted[0];
    screen.innerHTML = `
      <h2>🏆 ${winner.name} wins!</h2>
      <p style="color: var(--color-text-secondary); margin-bottom: 1.5rem;">Final scores after ${state.round} rounds:</p>
      <div class="section">
        ${sorted.map((p, i) => `
          <div class="player-card">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <strong>${i + 1}. ${p.name}</strong>
              <span style="font-size: 20px; font-weight: 500;">${p.totalScore}</span>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" onclick="window._resetGame()">New game</button>
    `;
  }

  // ====== ACTIONS ======

  window._addPlayer = function() {
    const input = document.getElementById('pname');
    const name = input.value.trim();
    if (!name) return;
    if (state.players.length >= 18) return;
    state.players.push({ name, totalScore: 0, numbers: [], modifiers: [], busted: false, stayed: false, frozen: false, secondChance: null });
    input.value = '';
    render();
  };

  window._removePlayer = function(i) {
    state.players.splice(i, 1);
    render();
  };

  window._clearPlayers = function() {
    state.players = [];
    render();
  };

  window._startGame = function() {
    if (state.players.length < 3) return;
    state.round = 1;
    state.deck = shuffle(buildDeck());
    state.discard = [];
    state.dealer = 0;
    beginRound();
  };

  function beginRound() {
    state.players.forEach(p => {
      p.numbers = [];
      p.modifiers = [];
      p.busted = false;
      p.stayed = false;
      p.frozen = false;
      p.secondChance = null;
    });
    state.log = [`--- Round ${state.round} ---`];
    // Deal one card to each player starting from player after dealer
    const dealOrder = [];
    for (let i = 1; i <= state.players.length; i++) {
      dealOrder.push((state.dealer + i) % state.players.length);
    }
    // Deal sequentially, resolving actions as they come
    state.dealQueue = dealOrder;
    state.currentPlayerIdx = dealOrder[0];
    dealInitialCards();
  }

  function dealInitialCards() {
    while (state.dealQueue.length > 0) {
      const idx = state.dealQueue.shift();
      const player = state.players[idx];
      const card = drawCard();
      if (!card) break;
      log(`${player.name} is dealt ${cardLabel(card)}.`);
      handleDrawnCard(idx, card, () => {
        // continue after action resolves
        dealInitialCards();
      });
      return; // wait for async action
    }
    // Done dealing. Find first active player after dealer.
    startPlayerTurn();
  }

  function cardLabel(c) {
    if (c.type === 'num') return `a ${c.value}`;
    if (c.type === 'mod') return `a ${c.label} modifier`;
    return `a ${c.label}`;
  }

  // Handles a drawn card for a specific player. Calls onDone when fully resolved.
  function handleDrawnCard(playerIdx, card, onDone) {
    const player = state.players[playerIdx];

    if (card.type === 'num') {
      // Check for duplicate
      const duplicate = player.numbers.some(n => n.value === card.value);
      if (duplicate) {
        if (player.secondChance) {
          // Use Second Chance
          state.discard.push(player.secondChance);
          state.discard.push(card);
          player.secondChance = null;
          log(`${player.name}'s Second Chance saves them from a duplicate ${card.value}!`);
          showReveal(player.name, card, `Duplicate ${card.value}! Second Chance saves ${player.name}.`, onDone);
        } else {
          // Bust!
          player.busted = true;
          log(`${player.name} BUSTS on duplicate ${card.value}!`);
          showReveal(player.name, card, `BUST! ${player.name} already had a ${card.value}.`, () => {
            // Discard their cards
            state.discard.push(...player.numbers, ...player.modifiers, card);
            if (player.secondChance) { state.discard.push(player.secondChance); player.secondChance = null; }
            player.numbers = [];
            player.modifiers = [];
            onDone();
          });
        }
      } else {
        player.numbers.push(card);
        log(`${player.name} takes the ${card.value}.`);
        // Check Flip 7
        if (player.numbers.length === 7) {
          log(`🎉 ${player.name} FLIPS 7! Round ends.`);
          showReveal(player.name, card, `FLIP 7! ${player.name} scores 15 bonus points and ends the round.`, () => {
            endRound(true);
          });
          return;
        }
        showReveal(player.name, card, null, onDone);
      }
    } else if (card.type === 'mod') {
      player.modifiers.push(card);
      log(`${player.name} picks up ${card.label}.`);
      showReveal(player.name, card, null, onDone);
    } else if (card.type === 'action') {
      if (card.value === 'second') {
        // Handled differently during flip three vs regular
        if (player.secondChance) {
          // Must give to another active player
          log(`${player.name} already has Second Chance - must give it to another active player.`);
          const others = activePlayers().filter(p => p !== player && !p.secondChance);
          if (others.length === 0) {
            state.discard.push(card);
            log(`No eligible players - Second Chance discarded.`);
            showReveal(player.name, card, `No one can take it. Discarded.`, onDone);
          } else {
            state.pendingAction = card;
            state.pendingActionSource = playerIdx;
            state.phase = 'actionTarget';
            state._actionDone = onDone;
            render();
          }
        } else {
          player.secondChance = card;
          showReveal(player.name, card, `${player.name} keeps Second Chance.`, onDone);
        }
      } else {
        // Freeze or Flip Three - player chooses target
        const actives = activePlayers();
        if (actives.length === 1 && actives[0] === player) {
          // Must play on self
          showReveal(player.name, card, `${card.label} — must play on self.`, () => {
            applyAction(playerIdx, playerIdx, card, onDone);
          });
        } else {
          state.pendingAction = card;
          state.pendingActionSource = playerIdx;
          state.phase = 'actionTarget';
          state._actionDone = onDone;
          render();
        }
      }
    }
  }

  function showReveal(playerName, card, message, onDone) {
    state.lastDrawnCard = { forPlayer: playerName, card, message: message || `${playerName} drew ${cardLabel(card)}.` };
    state.phase = 'cardReveal';
    state._revealDone = onDone;
    render();
  }

  window._dismissReveal = function() {
    state.phase = 'playing';
    const done = state._revealDone;
    state._revealDone = null;
    state.lastDrawnCard = null;
    if (done) done();
    else render();
  };

  window._resolveAction = function(targetIdx) {
    const card = state.pendingAction;
    const sourceIdx = state.pendingActionSource;
    const done = state._actionDone;
    state.pendingAction = null;
    state.pendingActionSource = null;
    state._actionDone = null;
    state.phase = 'playing';
    applyAction(sourceIdx, targetIdx, card, done);
  };

  window._discardAction = function() {
    const card = state.pendingAction;
    const done = state._actionDone;
    state.discard.push(card);
    state.pendingAction = null;
    state.pendingActionSource = null;
    state._actionDone = null;
    state.phase = 'playing';
    log(`${card.label} discarded - no valid targets.`);
    if (done) done();
    else render();
  };

  function applyAction(sourceIdx, targetIdx, card, onDone) {
    const target = state.players[targetIdx];
    if (card.value === 'freeze') {
      log(`${target.name} is FROZEN! Banks their points.`);
      target.frozen = true;
      // Bank points
      const score = calcRoundScore(target);
      target.totalScore += score;
      state.discard.push(card);
      state.discard.push(...target.numbers, ...target.modifiers);
      if (target.secondChance) { state.discard.push(target.secondChance); target.secondChance = null; }
      target.numbers = [];
      target.modifiers = [];
      checkRoundEnd(onDone);
    } else if (card.value === 'flipthree') {
      log(`${target.name} must flip 3 cards!`);
      state.discard.push(card);
      flipThree(targetIdx, 3, onDone);
    } else if (card.value === 'second') {
      target.secondChance = card;
      log(`${target.name} receives Second Chance.`);
      if (onDone) onDone();
    }
  }

  function flipThree(targetIdx, remaining, onDone) {
    const target = state.players[targetIdx];
    if (remaining === 0 || target.busted || target.numbers.length === 7) {
      // Resolve any pending extras (additional Freeze/Flip3 from within the 3 draws)
      if (state.pendingExtras && state.pendingExtras.length > 0 && !target.busted) {
        const extra = state.pendingExtras.shift();
        log(`Resolving pending ${extra.label} from Flip 3.`);
        const actives = activePlayers();
        if (actives.length === 0) {
          state.discard.push(extra);
          endRound(false);
          return;
        }
        if (actives.length === 1 && actives[0] === target) {
          applyAction(targetIdx, targetIdx, extra, () => flipThree(targetIdx, 0, onDone));
        } else {
          state.pendingAction = extra;
          state.pendingActionSource = targetIdx;
          state.phase = 'actionTarget';
          state._actionDone = () => flipThree(targetIdx, 0, onDone);
          render();
        }
        return;
      }
      if (onDone) onDone();
      return;
    }
    const card = drawCard();
    if (!card) {
      if (onDone) onDone();
      return;
    }
    log(`Flip 3 (${4 - remaining}/3): ${target.name} draws ${cardLabel(card)}.`);

    // Special handling: if card is Freeze or Flip Three during flip-three, queue it
    if (card.type === 'action' && (card.value === 'freeze' || card.value === 'flipthree')) {
      if (!state.pendingExtras) state.pendingExtras = [];
      state.pendingExtras.push(card);
      log(`${card.label} drawn during Flip 3 - will resolve after.`);
      showReveal(target.name, card, `${card.label} — saved for after the Flip 3.`, () => {
        flipThree(targetIdx, remaining - 1, onDone);
      });
      return;
    }

    handleDrawnCard(targetIdx, card, () => {
      flipThree(targetIdx, remaining - 1, onDone);
    });
  }

  function startPlayerTurn() {
    // Find next active player clockwise from dealer
    const actives = activePlayers();
    if (actives.length === 0) {
      endRound(false);
      return;
    }
    // Find first active player after (or including) current idx, starting from dealer+1
    for (let i = 1; i <= state.players.length; i++) {
      const idx = (state.dealer + i) % state.players.length;
      const p = state.players[idx];
      if (!p.busted && !p.stayed && !p.frozen) {
        state.currentPlayerIdx = idx;
        state.phase = 'pass';
        render();
        return;
      }
    }
    endRound(false);
  }

  window._readyToPlay = function() {
    state.phase = 'playing';
    render();
  };

  window._hit = function() {
    const idx = state.currentPlayerIdx;
    const card = drawCard();
    if (!card) {
      log('Deck and discard exhausted.');
      nextActive();
      return;
    }
    handleDrawnCard(idx, card, () => {
      // After card resolves, if player still active, they decide again
      const p = state.players[idx];
      if (p.busted || p.numbers.length === 7 || p.frozen) {
        nextActive();
      } else {
        // Same player decides again
        state.phase = 'playing';
        render();
      }
    });
  };

  window._stay = function() {
    const idx = state.currentPlayerIdx;
    const p = state.players[idx];
    if (p.numbers.length === 0 && p.modifiers.length === 0) return;
    p.stayed = true;
    const score = calcRoundScore(p);
    p.totalScore += score;
    log(`${p.name} stays with ${score} points.`);
    state.discard.push(...p.numbers, ...p.modifiers);
    if (p.secondChance) { state.discard.push(p.secondChance); p.secondChance = null; }
    p.numbers = [];
    p.modifiers = [];
    nextActive();
  };

  function nextActive() {
    const actives = activePlayers();
    if (actives.length === 0) {
      endRound(false);
      return;
    }
    // Move clockwise
    for (let i = 1; i <= state.players.length; i++) {
      const next = (state.currentPlayerIdx + i) % state.players.length;
      const p = state.players[next];
      if (!p.busted && !p.stayed && !p.frozen) {
        state.currentPlayerIdx = next;
        state.phase = 'pass';
        render();
        return;
      }
    }
    endRound(false);
  }

  function checkRoundEnd(onDone) {
    const actives = activePlayers();
    if (actives.length === 0) {
      endRound(false);
    } else if (onDone) {
      onDone();
    }
  }

  function endRound(flip7) {
    // Bank remaining active players (shouldn't normally happen except Flip 7)
    state.players.forEach(p => {
      if (!p.busted && !p.stayed && !p.frozen) {
        const score = calcRoundScore(p);
        p.totalScore += score;
        log(`${p.name} scores ${score} (round ended).`);
        state.discard.push(...p.numbers, ...p.modifiers);
        if (p.secondChance) { state.discard.push(p.secondChance); p.secondChance = null; }
      } else if (p.busted) {
        // already discarded
      }
      // Discard any remaining cards (Second Chance cards are always discarded at round end)
      if (p.secondChance) { state.discard.push(p.secondChance); p.secondChance = null; }
      p.numbers = [];
      p.modifiers = [];
    });
    // Check for game end
    if (state.players.some(p => p.totalScore >= 200)) {
      state.phase = 'gameEnd';
    } else {
      state.phase = 'roundEnd';
    }
    render();
  }

  window._nextRound = function() {
    state.round++;
    state.dealer = (state.dealer + 1) % state.players.length;
    beginRound();
  };

  window._resetGame = function() {
    state = {
      phase: 'setup',
      players: [],
      dealer: 0,
      currentPlayerIdx: 0,
      deck: [],
      discard: [],
      log: [],
      round: 0,
    };
    render();
  };

  render();
})();
</script>
